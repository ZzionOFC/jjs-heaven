<!DOCTYPE html>      
<html lang="en">      
<head>      
<meta charset="UTF-8">      
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">      
<title>Text Case Converter - JJS HEAVEN</title>      
<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">    
<link rel="manifest" href="manifest.json">    
<meta name="theme-color" content="#ff0000">    
<meta name="apple-mobile-web-app-capable" content="yes">    
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">    
<meta name="apple-mobile-web-app-title" content="JJS Heaven">    
<style>      
    
*{      
  box-sizing: border-box;      
  scroll-behavior: smooth;      
  -webkit-tap-highlight-color: transparent; 
}      
    
body {      
  background: #111;      
  color: red;      
  font-family: 'Finger Paint', cursive, sans-serif;      
  margin: 0;      
  padding: 0;      
  font-size: 16px;      
  transition: background 0.3s, color 0.3s;      
  overflow-x: hidden;      
  display: flex;  
  flex-direction: column;  
  height: 100vh; 
}      
    
#appHeader {    
  position: sticky;    
  top: 0;    
  z-index: 1000;    
  background: #111;    
  display: flex;  
  align-items: center;  
  justify-content: space-between;  
  padding: 10px 16px;  
  border-bottom: 1px solid rgba(255,0,0,0.2);    
  height: 60px;  
}    
    
#titulo {      
  font-size: 24px;      
  text-shadow: 0 0 12px currentColor;      
  margin: 0;  
}      
  
.menuIconBtn {  
  background: transparent;  
  border: none;  
  color: red;  
  font-size: 24px;  
  cursor: pointer;  
  padding: 5px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  transition: transform 0.2s ease;
}  

.menuIconBtn:active {
  transform: scale(0.9);
}
    
#appBody {  
  flex: 1;  
  overflow-y: auto;  
  padding: 20px 16px 80px; 
}  
  
#conteudo {      
  display: flex;      
  flex-direction: column;      
  gap: 15px;      
}      

textarea { 
  width: 100%; 
  height: 180px; 
  background: rgba(255,255,255,0.05); 
  border: 2px solid red; 
  border-radius: 15px; 
  color: red; 
  font-family: 'Finger Paint', cursive, sans-serif; 
  padding: 12px; 
  outline: none; 
  font-size: 14px; 
  resize: none;
  transition: border-color 0.3s, color 0.3s, box-shadow 0.2s;
}

textarea:focus {
  box-shadow: 0 0 12px currentColor;
}

.grid-btns { 
  display: grid; 
  grid-template-columns: repeat(2, 1fr); 
  gap: 10px; 
}
    
#appDrawer {      
  position: fixed;      
  top: 0;      
  left: -280px;     
  width: 280px;      
  height: 100vh;      
  background: rgba(10,10,10,0.85);      
  backdrop-filter: blur(20px);      
  -webkit-backdrop-filter: blur(20px);  
  padding: 20px 15px;      
  overflow-y: auto;      
  transition: transform 0.3s ease, left 0.3s ease, box-shadow 0.3s ease;     
  z-index: 4000;      
  border-right: 1px solid rgba(255,0,0,0.3);      
  display: flex;  
  flex-direction: column;  
  gap: 15px;  
  opacity: 0;
}      
    
#appDrawer.aberto {      
  transform: translateX(280px);  
  opacity: 1;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
}      
    
.menuPainelTitulo {      
  font-size: 22px;      
  margin-bottom: 10px;      
  text-align: center;      
  text-shadow: 0 0 10px currentColor;      
}      
    
#listaTemas {      
  display: none;      
  flex-direction: column;      
  gap: 8px;      
  margin-top: 10px;      
  max-height: 250px;  
  overflow-y: auto;  
  padding-right: 5px;  
}      
    
.temaBtn, .menuLink {      
  width: 100%;      
  padding: 12px;      
  border-radius: 10px;      
  cursor: pointer;      
  font-size: 14px;      
  font-family: 'Finger Paint', cursive, sans-serif;      
  transition: 0.2s;      
  background: rgba(34,34,34,0.4);      
  color: red;      
  border: 2px solid red;      
  text-align: center;  
  text-decoration: none;  
}      
    
.temaBtn:hover, .menuLink:hover {      
  box-shadow: 0 0 10px currentColor;      
  transform: scale(1.02);
}      
  
#overlay {  
  position: fixed;  
  top: 0; left: 0; width: 100vw; height: 100vh;  
  background: rgba(0,0,0,0.6);  
  z-index: 3500;  
  display: none;  
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: opacity 0.3s ease;
}  
    
#scrollBtn {      
  position: fixed;      
  bottom: 80px;      
  right: 16px;      
  width: 50px;      
  height: 50px;      
  border-radius: 50%;      
  border: 2px solid red;      
  background: rgba(20,20,20,0.7);      
  color: red;      
  font-size: 22px;      
  cursor: pointer;      
  z-index: 3000;      
  display: flex;      
  align-items: center;      
  justify-content: center;      
  transition: background-color 0.3s, border-color 0.3s, color 0.3s, transform 0.2s;
}      

#scrollBtn:active {
  transform: scale(0.9);
}
    
#presets {  
  position: fixed; 
  top: 0; 
  right: -280px; 
  width: 280px; 
  height: 100vh; 
  background: rgba(10,10,10,0.85); 
  backdrop-filter: blur(20px); 
  padding: 20px 15px; 
  transition: transform 0.3s ease, right 0.3s ease, box-shadow 0.3s ease; 
  z-index: 4000; 
  border-left: 1px solid rgba(255,0,0,0.3); 
  display: flex; 
  flex-direction: column; 
  gap: 15px;  
  opacity: 0;
}  

#presets.aberto {
  transform: translateX(-280px);
  opacity: 1;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
}
  
#bottomNav {  
  position: fixed;  
  bottom: 0; left: 0; right: 0;  
  height: 65px;  
  background: #111;  
  border-top: 1px solid rgba(255,0,0,0.2);  
  display: flex;  
  justify-content: space-around;  
  align-items: center;  
  z-index: 3000;  
  padding-bottom: env(safe-area-inset-bottom); 
}  
  
.navItem {  
  background: transparent;  
  border: none;  
  color: red;  
  font-family: 'Finger Paint', cursive, sans-serif;  
  font-size: 11px;  
  display: flex;  
  flex-direction: column;  
  align-items: center;  
  gap: 4px;  
  cursor: pointer;  
  flex: 1;  
  opacity: 0.6;  
  transition: 0.2s;  
  text-decoration: none;  
}  
  
.navItem.active, .navItem:hover {  
  opacity: 1;  
  text-shadow: 0 0 8px currentColor;  
}  
  
.navIcon {  
  font-size: 20px;  
}  
  
@media (max-width:700px){      
  body { font-size: 15px; }      
  #titulo { font-size: 20px; }      
}      
    
</style>      
</head>      
    
<body>      
    
<div id="overlay"></div>  
  
<header id="appHeader">    
  <button class="menuIconBtn" id="btnAbrirMenu">☰</button>    
  <div id="titulo">CASE CONV</div>      
  <button class="menuIconBtn" id="btnAbrirConfig">⚙</button>  
</header>      
  
<main id="appBody">  
  <div id="conteudo">
    <textarea id="textoInput" placeholder="Type or paste your text here..."></textarea>
    <div class="grid-btns">
      <button class="temaBtn" onclick="converter('upper')">UPPER CASE</button>
      <button class="temaBtn" onclick="converter('lower')">lower case</button>
      <button class="temaBtn" onclick="converter('snake')">snake_case</button>
      <button class="temaBtn" onclick="converter('camel')">camelCase</button>
    </div>
  </div>      
</main>  
  
<button id="scrollBtn">⌃</button>      
    
<div id="appDrawer">      
  <div class="menuPainelTitulo">Menu</div>      
  <a href="index.html" class="menuLink">🏠 Home</a>  
  <a href="jjs.json" data-fetch="true" class="menuLink">🔮 JJS Stats</a>
  <a href="impact.html" class="menuLink">💥 Impact</a>  
  <a href="blur.html" class="menuLink">🌫️ Blurscreen effect generator </a>  
  <a href="others.json" data-fetch="true" class="menuLink">📁 Others</a>
  <a href="json.html" class="menuLink">⚙️ ID Grabber And Text To .JSON</a>
  <a href="calc.html" class="menuLink">🧮 Calculator</a>
  <a href="case-converter.html" class="menuLink">🔤 Text Case Converter</a>
  <a href="palette-generator.html" class="menuLink">🎨 Palette Generator & Contrast</a>
  <button id="btnFecharMenu" class="temaBtn" style="margin-top:auto; background:rgba(255,0,0,0.1)">Close ✕</button>  
</div>      
  
<div id="presets">  
  <div class="menuPainelTitulo">Settings</div>  
  <button id="abrirTemasConfig" class="temaBtn">Themes ▼</button>      
    
  <div id="listaTemas">      
<button class="temaBtn" onclick="mudarTema('#fff4cc','#5a3d00','#ffe599','#5a3d00')">Old Paper</button>
<button class="temaBtn" onclick="mudarTema('#e8d7aa','#4a3200','#d9c28a','#4a3200')">Older Paper</button>
<button class="temaBtn" onclick="mudarTema('rgb(111,232,162)','black','#7be8a2','black')">Green & Black</button>
<button class="temaBtn" onclick="mudarTema('#f5f5f5','#222222','#e6e6e6','#222222')">Modern Wiki</button>
<button class="temaBtn" onclick="mudarTema('#f8f4e8','#3d3425','#e8dcc0','#3d3425')">Manuscript</button>
<button class="temaBtn" onclick="mudarTema('#ffffff','#2c2c2c','#f2f2f2','#2c2c2c')">Clean</button>
  </div>      
</div>  
  
<nav id="bottomNav">  
  <button class="navItem" onclick="window.location.href='index.html'">  
    <span class="navIcon">🏠</span>  
    <span>Home</span>  
  </button>  
  <button class="navItem active" onclick="window.location.href='case-converter.html'">  
    <span class="navIcon">⎘</span>  
    <span>Conv</span>  
  </button>  
  <button class="navItem" onclick="window.location.href='palette-generator.html'">  
    <span class="navIcon">⚛</span>  
    <span>Extras</span>  
  </button>  
  <button class="navItem" onclick="window.location.href='json.html'">  
    <span class="navIcon">🛠️</span>  
    <span>JSON</span>  
  </button>  
  <button class="navItem" onclick="window.location.href='calc.html'">  
    <span class="navIcon">🧮</span>  
    <span>Calc</span>  
  </button>  
</nav>  
    
<script>      

function converter(tipo) {
  const el = document.getElementById("textoInput");
  let t = el.value;
  if(tipo === 'upper') t = t.toUpperCase();
  if(tipo === 'lower') t = t.toLowerCase();
  if(tipo === 'snake') t = t.toLowerCase().replace(/\s+/g, '_').replace(/[^\w]/g, '');
  if(tipo === 'camel') t = t.toLowerCase().replace(/[^a-zA-Z0-9 ]/g, "").replace(/(?:^\w|[A-Z]|\b\w)/g, (word, index) => index === 0 ? word.toLowerCase() : word.toUpperCase()).replace(/\s+/g, "");
  el.value = t;
}
    
const drawer = document.getElementById("appDrawer");  
const presets = document.getElementById("presets");  
const overlay = document.getElementById("overlay");  
  
function fecharTodosMenus() {  
  drawer.classList.remove("aberto");  
  presets.classList.remove("aberto");  
  overlay.style.display = "none";  
}  
  
document.getElementById("btnAbrirMenu").onclick = () => {  
  fecharTodosMenus();
  drawer.classList.add("aberto");  
  overlay.style.display = "block";  
};  
  
document.getElementById("btnAbrirConfig").onclick = () => {  
  fecharTodosMenus();
  presets.classList.add("aberto");  
  overlay.style.display = "block";  
};  
  
document.getElementById("btnFecharMenu").onclick = fecharTodosMenus;  
overlay.onclick = fecharTodosMenus;  
    
const abrirTemas = document.getElementById("abrirTemasConfig");      
const listaTemas = document.getElementById("listaTemas");      
    
abrirTemas.onclick = () => {      
  const ok = listaTemas.style.display === "flex";      
  listaTemas.style.display = !ok ? "flex" : "none";      
  abrirTemas.textContent = ok ? "Themes ▼" : "Themes ▲";      
};      
    
const appBody = document.getElementById("appBody");  
const scrollBtn = document.getElementById("scrollBtn");  
  
appBody.onscroll = () => {  
  if (appBody.scrollTop > 300) {  
    scrollBtn.textContent = "⌃"; 
  } else {  
    scrollBtn.textContent = "⌄"; 
  }  
};  
  
scrollBtn.onclick = () => {      
  if (appBody.scrollTop > 300) {  
    appBody.scrollTo({ top: 0, behavior: "smooth" });  
  } else {  
    appBody.scrollTo({ top: appBody.scrollHeight, behavior: "smooth" });  
  }  
};      
    
function mudarTema(fundo,texto,inputBg,inputText){    
  localStorage.setItem("tema",JSON.stringify({ fundo,texto,inputBg,inputText }));      
    
  document.body.style.background=fundo;      
  document.body.style.color=texto;      
  document.getElementById("appHeader").style.background=fundo;      
  document.getElementById("bottomNav").style.background=fundo;      
  document.getElementById("titulo").style.color=texto;      
  
  document.getElementById("textoInput").style.color=texto;      
  document.getElementById("textoInput").style.borderColor=texto;      
    
  document.querySelectorAll(".menuIconBtn, .navItem, #scrollBtn").forEach(el => {  
    el.style.color = texto;  
  });  
  
  document.getElementById("scrollBtn").style.backgroundColor = inputBg;  
  document.getElementById("scrollBtn").style.borderColor = texto;  
    
  document.querySelectorAll(".temaBtn, .menuLink").forEach(b=>{      
    b.style.backgroundColor=inputBg;      
    b.style.color=inputText;      
    b.style.borderColor=texto;      
  });      
}      
    
const temaSalvo=localStorage.getItem("tema");    
if(temaSalvo){    
  try{    
    const t=JSON.parse(temaSalvo);    
    mudarTema(t.fundo,t.texto,t.inputBg,t.inputText);    
  }catch{    
    mudarTema('#111','red','#222','red');    
  }    
}else{    
  mudarTema('#111','red','#222','red');    
}      

document.addEventListener("DOMContentLoaded", function() {
  const path = window.location.pathname.split("/").pop();
  document.querySelectorAll("#bottomNav .navItem").forEach(item => {
    item.classList.remove("active");
    const clickAttr = item.getAttribute("onclick") || "";
    if(path && clickAttr.includes(path)) {
      item.classList.add("active");
    }
  });
});
</script>      
</body>      
</html>
