<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video to Frames Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: #ff3b3b;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 { margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 59, 59, 0.5); }

  .box {
    border: 2px solid red;
    border-radius: 12px;
    padding: 20px;
    width: 95%;
    max-width: 600px;
    background: #1a0505;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
  }

  label {
    display: block;
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
  }

  input[type="file"], select, input[type="number"], input[type="range"] {
    width: 100%;
    margin-top: 5px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid red;
    background: #0f0f0f;
    color: #ff3b3b;
    outline: none;
    box-sizing: border-box;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    margin-top: 15px;
  }

  .checkbox-label input { width: auto; margin: 0; }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid red;
    background: transparent;
    color: red;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  button:hover:not(:disabled) {
    background: rgba(255, 0, 0, 0.1);
    box-shadow: 0 0 10px red;
  }

  button:disabled {
    border-color: #555;
    color: #555;
    cursor: not-allowed;
    box-shadow: none;
  }

  #progress-bar-container {
    width: 100%;
    height: 10px;
    background: #333;
    border-radius: 5px;
    margin-top: 15px;
    overflow: hidden;
    display: none;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: red;
    box-shadow: 0 0 10px red;
    transition: width 0.2s;
  }

  #info {
    margin-top: 15px;
    font-size: 14px;
    color: #ffaaaa;
    text-align: center;
  }

  #preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
    justify-content: center;
    max-width: 800px;
  }

  #preview img {
    width: 120px;
    height: auto;
    border: 1px solid red;
    border-radius: 4px;
    background: #000;
  }
</style>
</head>

<body>

<h1>VIDEO → FRAMES PRO</h1>

<div class="box">
  <input type="file" id="video" accept="video/*" onchange="analyze()">

  <label>Frames per second (FPS)</label>
  <input type="number" id="fps" value="2" min="1" max="60" onchange="analyze()">

  <label>Format</label>
  <select id="format">
    <option value="png">PNG (High quality, larger file size)</option>
    <option value="jpg">JPG (Lightweight, faster processing)</option>
  </select>

  <label>Resolution</label>
  <select id="res">
    <option value="640:-1">360p</option>
    <option value="854:-1">480p</option>
    <option value="1280:-1">720p</option>
    <option value="1920:-1">1080p</option>
  </select>

  <label>JPG Quality (0–100%)</label>
  <input type="range" id="quality" min="10" max="100" value="90">

  <label class="checkbox-label">
    <input type="checkbox" id="maxQuality"> 100% MAX QUALITY (Processing intensive)
  </label>

  <div class="btn-group">
    <button id="btn-run" onclick="run()">Extract Frames</button>
    <button id="btn-zip" onclick="zip()" disabled>Download ZIP</button>
  </div>

  <div id="progress-bar-container">
    <div id="progress-bar"></div>
  </div>

  <div id="info">Please select a video to start.</div>
</div>

<div id="preview"></div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
  const { createFFmpeg, fetchFile } = FFmpeg;
  
  const ffmpeg = createFFmpeg({ 
    log: false,
    corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
  });

  let frames = [];
  let videoDuration = 0;

  ffmpeg.setProgress(({ ratio }) => {
    const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
    document.getElementById('progress-bar').style.width = `${pct}%`;
    document.getElementById('info').innerText = `Processing: ${pct}% complete...`;
  });

  function getVideoDuration(file) {
    return new Promise((resolve) => {
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.onloadedmetadata = function() {
        window.URL.revokeObjectURL(video.src);
        resolve(video.duration);
      }
      video.src = URL.createObjectURL(file);
    });
  }

  async function analyze() {
    const file = document.getElementById("video").files[0];
    if (!file) {
      document.getElementById("info").innerText = "No video selected.";
      return;
    }

    document.getElementById("info").innerText = "Analyzing video...";
    videoDuration = await getVideoDuration(file);

    const fps = +document.getElementById("fps").value;
    const estFrames = Math.round(videoDuration * fps);
    
    document.getElementById("info").innerHTML = 
      `<strong>Duration:</strong> ${videoDuration.toFixed(2)}s<br>` +
      `<strong>Estimated Frames:</strong> ~${estFrames} images`;
  }

  async function run() {
    const file = document.getElementById("video").files[0];
    if (!file) return alert("Select a video first!");

    const btnRun = document.getElementById("btn-run");
    const btnZip = document.getElementById("btn-zip");
    const progressBarContainer = document.getElementById("progress-bar-container");
    const progressBar = document.getElementById("progress-bar");
    
    btnRun.disabled = true;
    btnZip.disabled = true;
    progressBarContainer.style.display = "block";
    progressBar.style.width = "0%";
    document.getElementById("preview").innerHTML = "";
    frames = [];

    try {
      const fps = document.getElementById("fps").value;
      const format = document.getElementById("format").value;
      const res = document.getElementById("res").value;
      const quality = document.getElementById("quality").value;
      const maxQ = document.getElementById("maxQuality").checked;

      document.getElementById("info").innerText = "Loading FFmpeg engine...";
      if (!ffmpeg.isLoaded()) await ffmpeg.load();

      document.getElementById("info").innerText = "Preparing file...";
      ffmpeg.FS("writeFile", "input.mp4", await fetchFile(file));

      let args = [
        "-i", "input.mp4",
        "-vf", `fps=${fps},scale=${res}`
      ];

      if (format === "jpg") {
        const qValue = maxQ ? "2" : String(Math.max(2, Math.floor(31 - (quality * 0.29)))); 
        args.push("-q:v", qValue);
      }

      args.push(`frame%04d.${format}`);

      await ffmpeg.run(...args);

      document.getElementById("info").innerText = "Extracting generated images...";
      const files = ffmpeg.FS("readdir", "/");

      for (let f of files) {
        if (f.endsWith(format)) {
          const data = ffmpeg.FS("readFile", f);
          const blob = new Blob([data.buffer], { type: `image/${format}` });
          const url = URL.createObjectURL(blob);

          frames.push({ name: f, url, blob });

          let img = document.createElement("img");
          img.src = url;
          img.loading = "lazy";
          document.getElementById("preview").appendChild(img);
          
          ffmpeg.FS("unlink", f);
        }
      }

      ffmpeg.FS("unlink", "input.mp4");

      document.getElementById("info").innerHTML = `<strong>Success!</strong> ${frames.length} frames extracted.`;
      btnZip.disabled = false;

    } catch (err) {
      console.error(err);
      alert("Error detail: " + err.message);
      document.getElementById("info").innerHTML = `<span style="color:red">Process error. Check the console.</span>`;
    } finally {
      btnRun.disabled = false;
      progressBarContainer.style.display = "none";
    }
  }

  async function zip() {
    if (frames.length === 0) return alert("No frames to download.");
    
    document.getElementById("info").innerText = "Compressing ZIP file... please wait.";
    const btnZip = document.getElementById("btn-zip");
    btnZip.disabled = true;

    try {
      const zip = new JSZip();

      for (let f of frames) {
        zip.file(f.name, f.blob);
      }

      const content = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(content);
      a.download = "video_frames.zip";
      a.click();
      
      document.getElementById("info").innerText = "Download complete!";
    } catch (err) {
      document.getElementById("info").innerText = "Error creating ZIP.";
      console.error(err);
    } finally {
      btnZip.disabled = false;
    }
  }
</script>

</body>
</html>
