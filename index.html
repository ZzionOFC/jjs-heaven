<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJS HEAVEN</title>

<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body {
  background: #111;
  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  padding: 20px;
  margin: 0;
  font-size: 20px;
  transition: 0.3s;
}

/* TOP BAR */

#topo{
  position: sticky;
  top: 0;
  z-index: 1000;
  background:#111;
  padding-bottom:15px;
}

/* TITLE */

#titulo{
  text-align:center;
  font-size:42px;
  margin-bottom:18px;
  text-shadow:0 0 12px currentColor;
}

/* SEARCH */

#pesquisa {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  margin-bottom: 15px;
  border: 2px solid red;
  border-radius: 10px;
  outline: none;
  background: #222;
  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  transition: 0.2s;
}

#pesquisa:focus{
  box-shadow:0 0 12px currentColor;
}

/* THEMES BUTTON */

#abrirTemas {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 2px solid red;
  border-radius: 10px;
  background: #222;
  color: red;
  font-size: 18px;
  cursor: pointer;
  font-family: 'Finger Paint', cursive, sans-serif;
  transition: 0.2s;
}

#abrirTemas:hover {
  transform: scale(1.01);
}

/* THEMES */

#presets {
  display: none;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.temaBtn {
  padding: 10px 15px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-family: 'Finger Paint', cursive, sans-serif;
  transition: 0.2s;
  background: #222;
  color: red;
  border: 2px solid red;
}

.temaBtn:hover {
  transform: scale(1.05);
  box-shadow:0 0 10px currentColor;
}

/* CONTENT */

pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: 'Finger Paint', cursive, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  color: red;
}

/* MOBILE */

@media (max-width: 700px) {

  body {
    padding: 12px;
    font-size: 16px;
  }

  #titulo{
    font-size:30px;
  }

  #pesquisa {
    font-size: 16px;
    padding: 10px;
  }

  #presets {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .temaBtn {
    width: 100%;
    font-size: 13px;
    padding: 10px;
    border-radius: 12px;
  }

  pre {
    font-size: 15px;
    line-height: 1.4;
  }
}
</style>
</head>

<body>

<div id="topo">

<div id="titulo">
JJS HEAVEN
</div>

<input type="text" id="pesquisa" placeholder="Pesquisar...">

<button id="abrirTemas">
Site Themes ▼
</button>

<div id="presets">

<button class="temaBtn" onclick="mudarTema('white','black','#ddd','black')">
White & Black
</button>

<button class="temaBtn" onclick="mudarTema('#111','red','#222','red')">
Black & Red
</button>

<button class="temaBtn" onclick="mudarTema('rgb(111,232,162)','black','#7be8a2','black')">
Green & Black
</button>

<button class="temaBtn" onclick="mudarTema('#001f3f','#00ffff','#003366','#00ffff')">
Ocean Blue
</button>

<button class="temaBtn" onclick="mudarTema('#2b0a3d','#ff66ff','#4a1466','#ffccff')">
Purple Curse
</button>

<button class="temaBtn" onclick="mudarTema('#000000','#00ff00','#111111','#00ff00')">
Matrix
</button>

<button class="temaBtn" onclick="mudarTema('#fff4cc','#5a3d00','#ffe599','#5a3d00')">
Old Paper
</button>

<button class="temaBtn" onclick="mudarTema('#120000','#ff3c3c','#2b0000','#ff7b7b')">
Shrine
</button>

<button class="temaBtn" onclick="mudarTema('#0a0f1f','#7dd3fc','#111827','#dbeafe')">
Six Eyes
</button>

<button class="temaBtn" onclick="mudarTema('#1b1b1b','#89dceb','#2a2a2a','#d9f4ff')">
Idle Transfiguration
</button>

<button class="temaBtn" onclick="mudarTema('#240000','#ff4d4d','#3b0000','#ffb3b3')">
Blood Manipulation
</button>

<button class="temaBtn" onclick="mudarTema('#1a1a1a','#ffe066','#333333','#fff5b1')">
Ratio Technique
</button>

<button class="temaBtn" onclick="mudarTema('#050505','#8b5cf6','#111111','#ddd6fe')">
Ten Shadows
</button>

<button class="temaBtn" onclick="mudarTema('#000000','#ff0000','#111111','#ffb3b3')">
Black Flash
</button>

<button class="temaBtn" onclick="mudarTema('#000814','#48cae4','#001d3d','#caf0f8')">
Limitless
</button>

<button class="temaBtn" onclick="mudarTema('#14001f','#d980ff','#2a0040','#f0ccff')">
Cursed Speech
</button>

</div>

</div>

<pre id="conteudo"></pre>

<script>
let textoOriginal = "";

/* LOAD FILE */

fetch("dados.json")
  .then(res => res.text())
  .then(texto => {
    textoOriginal = texto;
    document.getElementById("conteudo").textContent = texto;
  })
  .catch(() => {
    document.getElementById("conteudo").textContent = "Erro ao carregar o JSON";
  });

/* SEARCH */

document.getElementById("pesquisa").addEventListener("input", function() {

  const busca = this.value.toLowerCase();

  if (busca === "") {
    document.getElementById("conteudo").textContent = textoOriginal;
    return;
  }

  const linhas = textoOriginal.split("\n");

  const resultado = linhas.filter(linha =>
    linha.toLowerCase().includes(busca)
  );

  document.getElementById("conteudo").textContent = resultado.join("\n");
});

/* THEMES */

function mudarTema(fundo, texto, inputBg, inputText) {

  document.body.style.backgroundColor = fundo;
  document.getElementById("topo").style.backgroundColor = fundo;

  document.body.style.color = texto;

  document.getElementById("conteudo").style.color = texto;

  const pesquisa = document.getElementById("pesquisa");

  pesquisa.style.backgroundColor = inputBg;
  pesquisa.style.color = inputText;
  pesquisa.style.borderColor = texto;

  const abrirTemas = document.getElementById("abrirTemas");

  abrirTemas.style.backgroundColor = inputBg;
  abrirTemas.style.color = inputText;
  abrirTemas.style.borderColor = texto;

  document.getElementById("titulo").style.color = texto;

  const botoes = document.querySelectorAll(".temaBtn");

  botoes.forEach(btn => {
    btn.style.backgroundColor = inputBg;
    btn.style.color = inputText;
    btn.style.border = "2px solid " + texto;
  });

  /* SAVE THEME */

  localStorage.setItem("tema", JSON.stringify({
    fundo,
    texto,
    inputBg,
    inputText
  }));
}

/* OPEN/CLOSE THEMES */

const abrirTemas = document.getElementById("abrirTemas");
const presets = document.getElementById("presets");

abrirTemas.addEventListener("click", () => {

  if (presets.style.display === "none" || presets.style.display === "") {

    if (window.innerWidth <= 700) {
      presets.style.display = "grid";
    } else {
      presets.style.display = "flex";
    }

    abrirTemas.textContent = "Site Themes ▲";

  } else {

    presets.style.display = "none";
    abrirTemas.textContent = "Site Themes ▼";

  }

});

/* LOAD SAVED THEME */

const temaSalvo = localStorage.getItem("tema");

if(temaSalvo){

  const tema = JSON.parse(temaSalvo);

  mudarTema(
    tema.fundo,
    tema.texto,
    tema.inputBg,
    tema.inputText
  );
}
</script>

</body>
</html>
