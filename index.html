<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJS HEAVEN</title>

<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">

<style>
body {
  background: #111;
  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  padding: 20px;
  margin: 0;
  font-size: 20px;
  transition: 0.3s;
}

#pesquisa {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  margin-bottom: 20px;
  border: 2px solid red;
  border-radius: 10px;
  outline: none;
  background: #222;
  color: red;
  box-sizing: border-box;
  font-family: 'Finger Paint', cursive, sans-serif;
}

#abrirTemas {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 2px solid red;
  border-radius: 10px;
  background: #222;
  color: red;
  font-size: 18px;
  cursor: pointer;
  font-family: 'Finger Paint', cursive, sans-serif;
  transition: 0.2s;
}

#abrirTemas:hover {
  transform: scale(1.01);
}

#presets {
  display: none;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.temaBtn {
  padding: 10px 15px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  font-family: 'Finger Paint', cursive, sans-serif;
  transition: 0.2s;
  background: #222;
  color: red;
  border: 2px solid red;
}

.temaBtn:hover {
  transform: scale(1.05);
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: 'Finger Paint', cursive, sans-serif;
  font-size: 20px;
  line-height: 1.5;
  color: red;
}

@media (max-width: 700px) {

  body {
    padding: 12px;
    font-size: 16px;
  }

  #pesquisa {
    font-size: 16px;
    padding: 10px;
  }

  #presets {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .temaBtn {
    width: 100%;
    font-size: 13px;
    padding: 10px;
    border-radius: 12px;
  }

  pre {
    font-size: 15px;
    line-height: 1.4;
  }
}
</style>
</head>

<body>

<input type="text" id="pesquisa" placeholder="Pesquisar...">

<button id="abrirTemas">
Techniques ▼
</button>

<div id="presets">

<button class="temaBtn" onclick="mudarTema('white','black','#ddd','black')">
White & Black
</button>

<button class="temaBtn" onclick="mudarTema('#111','red','#222','red')">
Black & Red
</button>

<button class="temaBtn" onclick="mudarTema('rgb(111,232,162)','black','#7be8a2','black')">
Green & Black
</button>

<button class="temaBtn" onclick="mudarTema('#001f3f','#00ffff','#003366','#00ffff')">
Ocean Blue
</button>

<button class="temaBtn" onclick="mudarTema('#2b0a3d','#ff66ff','#4a1466','#ffccff')">
Purple Curse
</button>

<button class="temaBtn" onclick="mudarTema('#000000','#00ff00','#111111','#00ff00')">
Matrix
</button>

<button class="temaBtn" onclick="mudarTema('#fff4cc','#5a3d00','#ffe599','#5a3d00')">
Old Paper
</button>

<button class="temaBtn" onclick="mudarTema('#120000','#ff3c3c','#2b0000','#ff7b7b')">
Shrine
</button>

<button class="temaBtn" onclick="mudarTema('#0a0f1f','#7dd3fc','#111827','#dbeafe')">
Six Eyes
</button>

<button class="temaBtn" onclick="mudarTema('#1c1c1c','#8be9fd','#2d2d2d','#ffffff')">
Idle Transfiguration
</button>

<button class="temaBtn" onclick="mudarTema('#1a0000','#ff5555','#330000','#ffaaaa')">
Blood Manipulation
</button>

<button class="temaBtn" onclick="mudarTema('#0f172a','#facc15','#1e293b','#fef08a')">
Ratio Technique
</button>

<button class="temaBtn" onclick="mudarTema('#001a00','#00ff88','#003300','#99ffcc')">
Ten Shadows
</button>

<button class="temaBtn" onclick="mudarTema('#2a0000','#ff9900','#552200','#ffd699')">
Black Flash
</button>

<button class="temaBtn" onclick="mudarTema('#000814','#48cae4','#001d3d','#caf0f8')">
Limitless
</button>

<button class="temaBtn" onclick="mudarTema('#14001f','#d980ff','#2a0040','#f0ccff')">
Cursed Speech
</button>

</div>

<pre id="conteudo"></pre>

<script>
let textoOriginal = "";

fetch("dados.json")
  .then(res => res.text())
  .then(texto => {
    textoOriginal = texto;
    document.getElementById("conteudo").textContent = texto;
  })
  .catch(() => {
    document.getElementById("conteudo").textContent = "Erro ao carregar o JSON";
  });

document.getElementById("pesquisa").addEventListener("input", function() {

  const busca = this.value.toLowerCase();

  if (busca === "") {
    document.getElementById("conteudo").textContent = textoOriginal;
    return;
  }

  const linhas = textoOriginal.split("\n");

  const resultado = linhas.filter(linha =>
    linha.toLowerCase().includes(busca)
  );

  document.getElementById("conteudo").textContent = resultado.join("\n");
});

function mudarTema(fundo, texto, inputBg, inputText) {

  document.body.style.backgroundColor = fundo;
  document.body.style.color = texto;

  document.getElementById("conteudo").style.color = texto;

  const pesquisa = document.getElementById("pesquisa");

  pesquisa.style.backgroundColor = inputBg;
  pesquisa.style.color = inputText;
  pesquisa.style.borderColor = texto;

  const abrirTemas = document.getElementById("abrirTemas");

  abrirTemas.style.backgroundColor = inputBg;
  abrirTemas.style.color = inputText;
  abrirTemas.style.borderColor = texto;

  const botoes = document.querySelectorAll(".temaBtn");

  botoes.forEach(btn => {
    btn.style.backgroundColor = inputBg;
    btn.style.color = inputText;
    btn.style.border = "2px solid " + texto;
  });
}

const abrirTemas = document.getElementById("abrirTemas");
const presets = document.getElementById("presets");

abrirTemas.addEventListener("click", () => {

  if (presets.style.display === "none") {

    if (window.innerWidth <= 700) {
      presets.style.display = "grid";
    } else {
      presets.style.display = "flex";
    }

    abrirTemas.textContent = "Techniques ▲";

  } else {

    presets.style.display = "none";
    abrirTemas.textContent = "Techniques ▼";

  }

});
</script>

</body>
</html>
