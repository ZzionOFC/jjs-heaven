<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJS HEAVEN</title>

<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">

<style>
body {
  background: #111;
  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  padding: 20px;
  margin: 0;
  font-size: 20px;
  transition: 0.3s;
}

#pesquisa,
#corTexto,
#corFundo {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  margin-bottom: 15px;
  border: 2px solid red;
  border-radius: 10px;
  outline: none;
  background: #222;
  color: red;
  box-sizing: border-box;
  font-family: 'Finger Paint', cursive, sans-serif;
}

#aplicarCor {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: red;
  color: white;
  margin-bottom: 20px;
  font-family: 'Finger Paint', cursive, sans-serif;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: 'Finger Paint', cursive, sans-serif;
  font-size: 20px;
  line-height: 1.5;
  color: red;
}
</style>
</head>

<body>

<input type="text" id="pesquisa" placeholder="Search Ids...">

<input type="text" id="corTexto" placeholder="Text Color (ex: red ou rgb(255,0,0))">

<input type="text" id="corFundo" placeholder="Background Color (ex: black ou rgb(0,0,0))">

<button id="aplicarCor">INPUT SELECTED COLORS</button>

<pre id="conteudo"></pre>

<script>
let textoOriginal = "";

fetch("dados.json")
  .then(res => res.text())
  .then(texto => {
    textoOriginal = texto;
    document.getElementById("conteudo").textContent = texto;
  })
  .catch(() => {
    document.getElementById("conteudo").textContent = "Erro ao carregar o JSON";
  });

document.getElementById("pesquisa").addEventListener("input", function() {

  const busca = this.value.toLowerCase();

  if (busca === "") {
    document.getElementById("conteudo").textContent = textoOriginal;
    return;
  }

  const linhas = textoOriginal.split("\n");

  const resultado = linhas.filter(linha =>
    linha.toLowerCase().includes(busca)
  );

  document.getElementById("conteudo").textContent = resultado.join("\n");
});

document.getElementById("aplicarCor").addEventListener("click", function() {

  const corTexto = document.getElementById("corTexto").value;
  const corFundo = document.getElementById("corFundo").value;

  if (corFundo !== "") {
    document.body.style.backgroundColor = corFundo;
  }

  if (corTexto !== "") {

    document.body.style.color = corTexto;

    document.getElementById("conteudo").style.color = corTexto;

    document.getElementById("pesquisa").style.color = corTexto;
    document.getElementById("pesquisa").style.borderColor = corTexto;

    document.getElementById("corTexto").style.color = corTexto;
    document.getElementById("corTexto").style.borderColor = corTexto;

    document.getElementById("corFundo").style.color = corTexto;
    document.getElementById("corFundo").style.borderColor = corTexto;

    document.getElementById("aplicarCor").style.backgroundColor = corTexto;
  }

});
</script>

</body>
</html>
