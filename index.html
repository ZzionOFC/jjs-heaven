<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JJS HEAVEN</title>

<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  background:
    radial-gradient(circle at top left, rgba(255,0,0,0.15), transparent 30%),
    radial-gradient(circle at bottom right, rgba(140,0,255,0.15), transparent 30%),
    #050505;

  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  padding: 20px;
  margin: 0;
  font-size: 20px;
  transition: 0.4s;
  min-height: 100vh;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  backdrop-filter: blur(8px);
  pointer-events: none;
}

#mainBox {
  background: rgba(20,20,20,0.55);
  border: 2px solid rgba(255,0,0,0.4);
  border-radius: 25px;
  padding: 20px;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow:
    0 0 25px rgba(255,0,0,0.25),
    inset 0 0 20px rgba(255,255,255,0.03);
}

#titulo {
  font-size: 45px;
  text-align: center;
  margin-bottom: 20px;
  color: red;
  text-shadow:
    0 0 10px red,
    0 0 20px red,
    0 0 40px rgba(255,0,0,0.5);
}

#pesquisa {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin-bottom: 20px;
  border: 2px solid rgba(255,0,0,0.5);
  border-radius: 15px;
  outline: none;
  background: rgba(30,30,30,0.6);
  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

#pesquisa:focus {
  box-shadow: 0 0 20px rgba(255,0,0,0.4);
  transform: scale(1.01);
}

#presets {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.temaBtn {
  padding: 12px 16px;
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.1);
  cursor: pointer;
  font-size: 15px;
  font-family: 'Finger Paint', cursive, sans-serif;
  background: rgba(255,255,255,0.08);
  color: white;
  backdrop-filter: blur(12px);
  transition: 0.25s;
}

.temaBtn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 18px rgba(255,255,255,0.2);
}

#conteudo {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 20px;
  line-height: 1.6;
  color: red;
  user-select: text;
}

.idNumero {
  background: rgba(255,255,255,0.06);
  padding: 2px 8px;
  border-radius: 8px;
  display: inline-block;
  margin: 2px;
}

@media (max-width: 700px) {

  body {
    padding: 10px;
    font-size: 16px;
  }

  #mainBox {
    padding: 14px;
    border-radius: 18px;
  }

  #titulo {
    font-size: 28px;
  }

  #pesquisa {
    font-size: 15px;
    padding: 12px;
    border-radius: 12px;
  }

  #presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .temaBtn {
    width: 100%;
    font-size: 12px;
    padding: 12px 8px;
    border-radius: 12px;
  }

  #conteudo {
    font-size: 15px;
    line-height: 1.5;
  }

  .idNumero {
    padding: 8px;
    border-radius: 10px;
  }
}
</style>
</head>

<body>

<div id="mainBox">

<div id="titulo">JJS HEAVEN</div>

<input type="text" id="pesquisa" placeholder="Pesquisar...">

<div id="presets">

<button class="temaBtn" onclick="mudarTema('white','black','#ddd','black')">
White & Black
</button>

<button class="temaBtn" onclick="mudarTema('#111','red','#222','red')">
Black & Red
</button>

<button class="temaBtn" onclick="mudarTema('rgb(111,232,162)','black','#7be8a2','black')">
Green & Black
</button>

<button class="temaBtn" onclick="mudarTema('#001f3f','#00ffff','#003366','#00ffff')">
Ocean Blue
</button>

<button class="temaBtn" onclick="mudarTema('#2b0a3d','#ff66ff','#4a1466','#ffccff')">
Purple Curse
</button>

<button class="temaBtn" onclick="mudarTema('#000000','#00ff00','#111111','#00ff00')">
Matrix
</button>

<button class="temaBtn" onclick="mudarTema('#fff4cc','#5a3d00','#ffe599','#5a3d00')">
Old Paper
</button>

<button class="temaBtn" onclick="mudarTema('#120000','#ff3c3c','#2b0000','#ff7b7b')">
Sukuna Mode
</button>

<button class="temaBtn" onclick="mudarTema('#050505','#ff0000','#1a1a1a','#ffffff')">
Domain Expansion
</button>

<button class="temaBtn" onclick="mudarTema('#0f172a','#38bdf8','#1e293b','#e0f2fe')">
Gojo Sky
</button>

</div>

<pre id="conteudo"></pre>

</div>

<script>
let textoOriginal = "";

fetch("dados.json")
  .then(res => res.text())
  .then(texto => {
    textoOriginal = texto;
    mostrarTexto(texto);
  })
  .catch(() => {
    document.getElementById("conteudo").textContent = "Erro ao carregar o JSON";
  });

function mostrarTexto(texto) {

  const linhas = texto.split("\n");

  const html = linhas.map(linha => {

    return linha.replace(/\b\d{6,}\b/g, function(id) {
      return `<span class="idNumero">${id}</span>`;
    });

  }).join("\n");

  document.getElementById("conteudo").innerHTML = html;

  ativarSelecaoIds();
}

function ativarSelecaoIds() {

  const ids = document.querySelectorAll(".idNumero");

  ids.forEach(id => {

    id.addEventListener("click", function() {

      const range = document.createRange();
      range.selectNodeContents(this);

      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      navigator.clipboard.writeText(this.textContent);

      this.style.transform = "scale(1.08)";

      setTimeout(() => {
        this.style.transform = "scale(1)";
      }, 150);

    });

  });
}


document.getElementById("pesquisa").addEventListener("input", function() {

  const busca = this.value.toLowerCase();

  if (busca === "") {
    mostrarTexto(textoOriginal);
    return;
  }

  const linhas = textoOriginal.split("\n");

  const resultado = linhas.filter(linha =>
    linha.toLowerCase().includes(busca)
  );

  mostrarTexto(resultado.join("\n"));
});

function mudarTema(fundo, texto, inputBg, inputText) {

  document.body.style.backgroundColor = fundo;
  document.body.style.color = texto;

  const conteudo = document.getElementById("conteudo");
  conteudo.style.color = texto;

  const pesquisa = document.getElementById("pesquisa");

  pesquisa.style.backgroundColor = inputBg;
  pesquisa.style.color = inputText;
  pesquisa.style.borderColor = texto;

  document.getElementById("mainBox").style.borderColor = texto;
  document.getElementById("mainBox").style.boxShadow = `0 0 25px ${texto}`;

  document.getElementById("titulo").style.color = texto;
  document.getElementById("titulo").style.textShadow = `0 0 10px ${texto}, 0 0 20px ${texto}`;

  const botoes = document.querySelectorAll(".temaBtn");

  botoes.forEach(btn => {
    btn.style.backgroundColor = inputBg;
    btn.style.color = inputText;
    btn.style.border = "2px solid " + texto;
  });

  const ids = document.querySelectorAll(".idNumero");

  ids.forEach(id => {
    id.style.border = `1px solid ${texto}`;
  });
}
</script>

</body>
</html>
