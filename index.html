<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>JJS HEAVEN</title>  
<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">  
<style>  

*{  
  box-sizing:border-box;  
  scroll-behavior:smooth;  
}  

body{  
  background:#111;  
  color:red;  
  font-family:'Finger Paint', cursive, sans-serif;  
  padding:20px;  
  margin:0;  
  font-size:20px;  
  transition:0.3s;  
  overflow-x:hidden;  
}  

#topo{
  position:sticky;
  top:0;
  z-index:1000;
  padding-bottom:15px;
  border-bottom:1px solid rgba(255,0,0,0.2);
  background:#111;
}

#titulo{  
  background:transparent;  
  text-align:center;  
  font-size:42px;  
  margin-bottom:18px;  
  text-shadow:0 0 12px currentColor;  
}  

#pesquisa{  
  width:100%;  
  padding:12px;  
  font-size:18px;  
  border:2px solid red;  
  border-radius:14px;  
  outline:none;  
  background:rgba(255,255,255,0.08);  
  color:red;  
  font-family:'Finger Paint', cursive, sans-serif;  
  transition:0.2s;  
}  

#pesquisa:focus{  
  box-shadow:0 0 15px currentColor;  
}  

#botoesFlutuantes{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:5000;
}

#menuTemas,
#abrirConv,
#abrirExtras{
  width:58px;
  height:58px;
  border-radius:50%;
  border:2px solid red;
  background:rgba(34,34,34,0.45);
  color:red;
  font-size:28px;
  cursor:pointer;
  transition:0.25s;
  font-family:'Finger Paint', cursive, sans-serif;
}

#menuTemas:hover{
  transform:rotate(90deg);
}

#abrirConv:hover{
  transform:rotate(-90deg);
}

#abrirExtras:hover{
  transform:rotate(90deg);
}

#presets{  
  position:fixed;  
  top:0;  
  right:-340px;  
  width:340px;  
  max-width:100%;  
  height:100vh;  
  background:rgba(10,10,10,0.42);  
  backdrop-filter:blur(24px);  
  padding:90px 15px 20px;  
  overflow-y:auto;  
  transition:0.35s;  
  z-index:4000;  
  border-left:1px solid rgba(255,0,0,0.3);  
}  

#presets.aberto{  
  right:0;  
}  

#configTitulo{  
  font-size:28px;  
  margin-bottom:15px;  
  text-align:center;  
  text-shadow:0 0 10px currentColor;  
}  

#listaTemas{  
  display:none;  
  flex-direction:column;  
  gap:10px;  
  margin-top:10px;  
}  

.temaBtn{  
  width:100%;  
  padding:12px;  
  border-radius:14px;  
  cursor:pointer;  
  font-size:14px;  
  font-family:'Finger Paint', cursive, sans-serif;  
  transition:0.2s;  
  background:rgba(34,34,34,0.4);  
  color:red;  
  border:2px solid red;  
}  

.temaBtn:hover{  
  box-shadow:0 0 12px currentColor;  
}  

#conteudo{  
  display:flex;  
  flex-direction:column;  
  gap:0;  
  margin-top:10px;  
}  

.linha{  
  padding:2px 0;  
  margin:0;  
  word-break:break-word;  
  font-size:18px;  
  line-height:1.2;  
}  

#scrollBtn{  
  position:fixed;  
  bottom:20px;  
  right:20px;  
  width:62px;  
  height:62px;  
  border-radius:50%;  
  border:2px solid red;  
  background:rgba(20,20,20,0.45);  
  color:red;  
  font-size:30px;  
  cursor:pointer;  
  z-index:5000;  
  display:flex;  
  align-items:center;  
  justify-content:center;  
}  

#statusFrames{  
  font-size:13px;  
  text-align:center;  
  word-break:break-word;  
}  

@media (max-width:700px){  
  body{padding:12px;font-size:16px;}  
  #titulo{font-size:30px;}  
  #pesquisa{font-size:16px;padding:10px;}  
  #presets{width:100%;right:-100%;padding-top:90px;}  
  .temaBtn{font-size:13px;}  
  #scrollBtn{width:54px;height:54px;font-size:24px;}  
}  

</style>  
</head>  

<body>  

<div id="botoesFlutuantes">
  <button id="menuTemas">⚙</button>
  <button id="abrirConv">⎘</button>
  <button id="abrirExtras">⚛</button>
</div>

<button id="scrollBtn">⌄</button>  

<div id="topo">  
  <div id="titulo">JJS HEAVEN</div>  
  <input type="text" id="pesquisa" placeholder="Search...">
</div>  

<div id="presets">  

  <div id="configTitulo">Settings</div>  

  <button id="abrirTemasConfig" class="temaBtn">Themes ▼</button>  

  <div id="listaTemas">  
    <button class="temaBtn" onclick="mudarTema('#111','red','#222','red')">Shrine</button>
    <button class="temaBtn" onclick="mudarTema('#000','lime','#111','lime')">Matrix</button>
    <button class="temaBtn" onclick="mudarTema('white','black','#ddd','black')">White & Black</button>
    <button class="temaBtn" onclick="mudarTema('#111','red','#222','red')">Black & Red</button>
    <button class="temaBtn" onclick="mudarTema('rgb(111,232,162)','black','#7be8a2','black')">Green & Black</button>
    <button class="temaBtn" onclick="mudarTema('#001f3f','#00ffff','#003366','#00ffff')">Ocean Blue</button>
    <button class="temaBtn" onclick="mudarTema('#2b0a3d','#ff66ff','#4a1466','#ffccff')">Purple Curse</button>
    <button class="temaBtn" onclick="mudarTema('#000000','#00ff00','#111111','#00ff00')">Matrix Cyber</button>
    <button class="temaBtn" onclick="mudarTema('#fff4cc','#5a3d00','#ffe599','#5a3d00')">Old Paper</button>
    <button class="temaBtn" onclick="mudarTema('#e8d7aa','#4a3200','#d9c28a','#4a3200')">Older Paper</button>
    <button class="temaBtn" onclick="mudarTema('#120000','#ff3c3c','#2b0000','#ff7b7b')">Shrine Blood</button>
    <button class="temaBtn" onclick="mudarTema('#0a0f1f','#7dd3fc','#111827','#dbeafe')">Six Eyes</button>
    <button class="temaBtn" onclick="mudarTema('#1b1b1b','#89dceb','#2a2a2a','#d9f4ff')">Idle Transfiguration</button>
    <button class="temaBtn" onclick="mudarTema('#240000','#ff4d4d','#3b0000','#ffb3b3')">Blood Curse</button>
    <button class="temaBtn" onclick="mudarTema('#1a1a1a','#ffe066','#333333','#fff5b1')">Golden Ratio</button>
    <button class="temaBtn" onclick="mudarTema('#050505','#8b5cf6','#111111','#ddd6fe')">Ten Shadows</button>
    <button class="temaBtn" onclick="mudarTema('#000000','#ff0000','#111111','#ffb3b3')">Black Flash</button>
    <button class="temaBtn" onclick="mudarTema('#000814','#48cae4','#001d3d','#caf0f8')">Limitless</button>
    <button class="temaBtn" onclick="mudarTema('#14001f','#d980ff','#2a0040','#f0ccff')">Cursed Speech</button>
 <button class="temaBtn" onclick="mudarTema('#001510','#00ff88','#002b20','#00ff88')">Emerald Curse</button>
<button class="temaBtn" onclick="mudarTema('#1a0f00','#ff8800','#2e1a00','#ff8800')">Scorched Earth</button>
<button class="temaBtn" onclick="mudarTema('#0f0f1a','#a855f7','#1e1e30','#d8b4fe')">Void Essence</button>
<button class="temaBtn" onclick="mudarTema('#0f172a','#38bdf8','#1e293b','#e2f8ff')">Frost Bite</button>
<button class="temaBtn" onclick="mudarTema('#171717','#d4d4d8','#262626','#ffffff')">Silver Grade</button>
<button class="temaBtn" onclick="mudarTema('#20002c','#c084fc','#310044','#f3e8ff')">Deep Nebula</button>
<button class="temaBtn" onclick="mudarTema('#050000','#800000','#1a0000','#ff4d4d')">Crimson Night</button>
<button class="temaBtn" onclick="mudarTema('#0c0a09','#78716c','#1c1917','#d6d3d1')">Ashen World</button>
<button class="temaBtn" onclick="mudarTema('#020617','#1e40af','#0f172a','#93c5fd')">Abyssal Blue</button>
<button class="temaBtn" onclick="mudarTema('#fafafa','#2563eb','#f1f5f9','#1d4ed8')">Pure Soul</button>
<button class="temaBtn" onclick="mudarTema('#fff7ed','#ea580c','#ffedd5','#9a3412')">Sun Village</button>
<button class="temaBtn" onclick="mudarTema('#062006','#4ade80','#0d350d','#bbf7d0')">Forest Spirit</button>
  </div>  

</div>  

<div id="conteudo"></div>  

<script>  

let textoOriginal = "";  

function normalizar(t){  
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s]/gi,"");  
}  

function renderizar(t){  
  const c = document.getElementById("conteudo");  
  c.innerHTML="";  
  t.split("\n").forEach(l=>{  
    if(!l.trim()) return;  
    const d=document.createElement("div");  
    d.className="linha";  
    d.textContent=l;  
    c.appendChild(d);  
  });  
}  

fetch("dados.json").then(r=>r.text()).then(t=>{  
  textoOriginal=t;  
  renderizar(t);  
});  

document.getElementById("pesquisa").addEventListener("input",function(){  
  const b=normalizar(this.value);  
  if(!b) return renderizar(textoOriginal);  
  renderizar(textoOriginal.split("\n").filter(l=>normalizar(l).includes(b)).join("\n"));  
});  

function mudarTema(fundo,texto,inputBg,inputText){  
  document.body.style.background=fundo;  
  document.body.style.color=texto;  

  document.getElementById("topo").style.background=fundo;  
  document.getElementById("titulo").style.color=texto;  
  
  const p=document.getElementById("pesquisa");  
  p.style.color=texto;  
  p.style.borderColor=texto;  

  const m=document.getElementById("menuTemas");  
  m.style.color=texto;  
  m.style.backgroundColor=inputBg;  
  m.style.borderColor=texto;  

  const s=document.getElementById("scrollBtn");  
  s.style.color=texto;  
  s.style.backgroundColor=inputBg;  
  s.style.borderColor=texto;  

  const conv=document.getElementById("abrirConv");
  conv.style.color=texto;
  conv.style.backgroundColor=inputBg;
  conv.style.borderColor=texto;

  const extras=document.getElementById("abrirExtras");
  extras.style.color=texto;
  extras.style.backgroundColor=inputBg;
  extras.style.borderColor=texto;

  document.querySelectorAll(".temaBtn").forEach(b=>{  
    b.style.backgroundColor=inputBg;  
    b.style.color=inputText;  
    b.style.borderColor=texto;  
  });  
}  

const menu=document.getElementById("menuTemas");  
const presets=document.getElementById("presets");  

menu.onclick=()=>presets.classList.toggle("aberto");  

const abrir=document.getElementById("abrirTemasConfig");  
const lista=document.getElementById("listaTemas");  

abrir.onclick=()=>{  
  const ok=lista.style.display==="flex";  
  lista.style.display=ok?"none":"flex";  
  abrir.textContent=ok?"Themes ▼":"Themes ▲";  
};  

document.getElementById("scrollBtn").onclick=()=>{  
  window.scrollTo({
    top:window.scrollY>300?0:document.body.scrollHeight,
    behavior:"smooth"
  });  
};  

mudarTema('#111','red','#222','red');  

document.getElementById("abrirConv").onclick = () => {
  window.location.href = "conv.html";
};

document.getElementById("abrirExtras").onclick = () => {
  window.location.href = "extras.html";
};

</script>  

</body>  
</html>
