<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JJS HEAVEN</title>

<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">

<style>
body {
  background: #111;
  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  padding: 20px;
  margin: 0;
}

pre {
  white-space: pre;
  font-family: 'Finger Paint', cursive, sans-serif;
}
</style>
</head>

<body>

<pre id="conteudo"></pre>

<script>
fetch("dados.json")
  .then(res => res.text())
  .then(texto => {
    document.getElementById("conteudo").textContent = texto;
  });
</script>

</body>
</html>
