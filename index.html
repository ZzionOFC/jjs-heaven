<!DOCTYPE html>      
<html lang="en">      
<head>      
<meta charset="UTF-8">      
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">      
<title>JJS HEAVEN</title>      
<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">    
<link rel="manifest" href="manifest.json">    
<meta id="themeColorMeta" name="theme-color" content="#111111">    
<meta name="apple-mobile-web-app-capable" content="yes">    
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">    
<meta name="apple-mobile-web-app-title" content="JJS Heaven">    
<style>      
    
*{      
  box-sizing: border-box;      
  scroll-behavior: smooth;      
  -webkit-tap-highlight-color: transparent; 
}      
    
body {      
  background: #111;      
  color: red;      
  font-family: 'Finger Paint', cursive, sans-serif;      
  margin: 0;      
  padding: 0;      
  font-size: 16px;      
  transition: background 0.3s, color 0.3s;      
  overflow-x: hidden;      
  display: flex;  
  flex-direction: column;  
  height: 100vh; 
}      
    
#appHeader {    
  position: sticky;    
  top: 0;    
  z-index: 1000;    
  background: #111;    
  display: flex;  
  align-items: center;  
  justify-content: space-between;  
  padding: 10px 16px;  
  border-bottom: 1px solid rgba(255,0,0,0.2);    
  height: 60px;  
}    
    
#titulo {      
  font-size: 24px;      
  text-shadow: 0 0 12px currentColor;      
  margin: 0;  
}      
  
.menuIconBtn {  
  background: transparent;  
  border: none;  
  color: red;  
  font-size: 24px;  
  cursor: pointer;  
  padding: 5px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  transition: transform 0.2s ease;
}  

.menuIconBtn:active {
  transform: scale(0.9);
}
    
#searchContainer {  
  padding: 10px 16px;  
  background: #111;  
  position: relative;
}  
  
#pesquisa {      
  width: 100%;      
  padding: 10px 40px 10px 14px;      
  font-size: 15px;      
  border: 2px solid red;      
  border-radius: 25px;     
  outline: none;      
  background: rgba(255,255,255,0.05);      
  color: red;      
  font-family: 'Finger Paint', cursive, sans-serif;      
  transition: 0.2s;      
}      
    
#pesquisa:focus {      
  box-shadow: 0 0 12px currentColor;      
}      

/* Botão de limpar busca adicionado */
#clearSearchBtn {
  position: absolute;
  right: 30px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: inherit;
  font-family: 'Finger Paint', cursive, sans-serif;
  font-size: 14px;
  cursor: pointer;
  display: none;
  padding: 5px;
}
    
#appBody {  
  flex: 1;  
  overflow-y: auto;  
  padding: 10px 16px 80px; 
}  
  
#conteudo {      
  display: flex;      
  flex-direction: column;      
  gap: 6px;      
}      
    
.linha {      
  padding: 12px;      
  margin: 0;      
  word-break: break-word;      
  font-size: 15px;      
  line-height: 1.4;      
  background: rgba(255, 0, 0, 0.03);  
  border-radius: 8px;  
  border-left: 3px solid currentColor;  
  color: inherit; 
  transition: background 0.2s ease, transform 0.2s ease;
}      

.linha:hover {
  background: rgba(255, 0, 0, 0.08);
  transform: translateX(2px);
}

.categoria-titulo {
  font-size: 18px;
  margin: 15px 0 5px 0;
  text-shadow: 0 0 8px currentColor;
  border-bottom: 1px dashed rgba(255, 0, 0, 0.2);
  padding-bottom: 3px;
}
    
/* Menu Lateral / Drawer */  
#appDrawer {      
  position: fixed;      
  top: 0;      
  left: -280px;     
  width: 280px;      
  height: 100vh;      
  background: rgba(10,10,10,0.85);      
  backdrop-filter: blur(20px);      
  -webkit-backdrop-filter: blur(20px);  
  padding: 20px 15px;      
  overflow-y: auto;      
  transition: transform 0.3s ease, left 0.3s ease, box-shadow 0.3s ease;     
  z-index: 4000;      
  border-right: 1px solid rgba(255,0,0,0.3);      
  display: flex;  
  flex-direction: column;  
  gap: 15px;  
  opacity: 0;
}      
    
#appDrawer.aberto {      
  transform: translateX(280px);  
  opacity: 1;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
}      
    
.menuPainelTitulo {      
  font-size: 22px;      
  margin-bottom: 10px;      
  text-align: center;      
  text-shadow: 0 0 10px currentColor;      
}      
    
#listaTemas {      
  display: none;      
  flex-direction: column;      
  gap: 8px;      
  margin-top: 10px;      
  max-height: 250px;  
  overflow-y: auto;  
  padding-right: 5px;  
}      
    
.temaBtn, .menuLink {      
  width: 100%;      
  padding: 12px;      
  border-radius: 10px;      
  cursor: pointer;      
  font-size: 14px;      
  font-family: 'Finger Paint', cursive, sans-serif;      
  transition: 0.2s;      
  background: rgba(34,34,34,0.4);      
  color: red;      
  border: 2px solid red;      
  text-align: center;  
  text-decoration: none;  
}      
    
.temaBtn:hover, .menuLink:hover {      
  box-shadow: 0 0 10px currentColor;      
  transform: scale(1.02);
}      
  
#overlay {  
  position: fixed;  
  top: 0; left: 0; width: 100vw; height: 100vh;  
  background: rgba(0,0,0,0.6);  
  z-index: 3500;  
  display: none;  
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: opacity 0.3s ease;
}  
    
#scrollBtn {      
  position: fixed;      
  bottom: 80px;      
  right: 16px;      
  width: 50px;      
  height: 50px;      
  border-radius: 50%;      
  border: 2px solid red;      
  background: rgba(20,20,20,0.7);      
  color: red;      
  font-size: 22px;      
  cursor: pointer;      
  z-index: 3000;      
  display: flex;      
  align-items: center;      
  justify-content: center;      
  transition: background-color 0.3s, border-color 0.3s, color 0.3s, transform 0.2s;
}      

#scrollBtn:active {
  transform: scale(0.9);
}
    
/* Painel de Configurações Lateral Direito */  
#presets {  
  position: fixed; 
  top: 0; 
  right: -280px; 
  width: 280px; 
  height: 100vh; 
  background: rgba(10,10,10,0.85); 
  backdrop-filter: blur(20px); 
  padding: 20px 15px; 
  transition: transform 0.3s ease, right 0.3s ease, box-shadow 0.3s ease; 
  z-index: 4000; 
  border-left: 1px solid rgba(255,0,0,0.3); 
  display: flex; 
  flex-direction: column; 
  gap: 15px;  
  opacity: 0;
}  

#presets.aberto {
  transform: translateX(-280px);
  opacity: 1;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
}
  
#bottomNav {  
  position: fixed;  
  bottom: 0; left: 0; right: 0;  
  height: 65px;  
  background: #111;  
  border-top: 1px solid rgba(255,0,0,0.2);  
  display: flex;  
  justify-content: space-around;  
  align-items: center;  
  z-index: 3000;  
  padding-bottom: env(safe-area-inset-bottom); 
}  
  
.navItem {  
  background: transparent;  
  border: none;  
  color: red;  
  font-family: 'Finger Paint', cursive, sans-serif;  
  font-size: 11px;  
  display: flex;  
  flex-direction: column;  
  align-items: center;  
  gap: 4px;  
  cursor: pointer;  
  flex: 1;  
  opacity: 0.6;  
  transition: 0.2s;  
  text-decoration: none;  
}  
  
.navItem.active, .navItem:hover {  
  opacity: 1;  
  text-shadow: 0 0 8px currentColor;  
}  
  
.navIcon {  
  font-size: 20px;  
}  
  
@media (max-width:700px){      
  body { font-size: 15px; }      
  #titulo { font-size: 20px; }      
}      
    
</style>      
</head>      
    
<body>      
    
<div id="overlay"></div>  
  
<header id="appHeader">    
  <button class="menuIconBtn" id="btnAbrirMenu">☰</button>    
  <div id="titulo">JJS HEAVEN</div>      
  <button class="menuIconBtn" id="btnAbrirConfig">⚙</button>  
</header>      
  
<div id="searchContainer">  
  <input type="text" id="pesquisa" placeholder="Search the collection...">    
  <button id="clearSearchBtn">✕</button>
</div>  
  
<main id="appBody">  
  <div id="conteudo"></div>      
</main>  
  
<button id="scrollBtn">⌃</button>      
    
<div id="appDrawer">      
  <div class="menuPainelTitulo">Menu</div>      
  <a href="dados.json" data-fetch="true" class="menuLink">🏠 Home</a>  
  <a href="jjs.json" data-fetch="true" class="menuLink">🔮 JJS Stats</a>
  <a href="impact.html" class="menuLink">💥 Impact</a>  
  <a href="blur.html" class="menuLink">🌫️ Blurscreen effect generator </a>  
  <a href="others.json" data-fetch="true" class="menuLink">📁 Others</a>
  <a href="json.html" class="menuLink">⚙️ ID Grabber And Text To .JSON</a>
  <a href="calc.html" class="menuLink">🧮 Calculator</a>
  <a href="case-converter.html" class="menuLink">🔤 Text Case Converter</a>
  <a href="palette-generator.html" class="menuLink">🎨 Palette Generator & Contrast</a>
  <button id="btnFecharMenu" class="temaBtn" style="margin-top:auto; background:rgba(255,0,0,0.1)">Close ✕</button>  
</div>      
  
<div id="presets">  
  <div class="menuPainelTitulo">Settings</div>  
  <button id="abrirTemasConfig" class="temaBtn">Themes ▼</button>      
    
  <div id="listaTemas">      
<button class="temaBtn" onclick="mudarTema('#fff4cc','#5a3d00','#ffe599','#5a3d00')">Old Paper</button>
<button class="temaBtn" onclick="mudarTema('#e8d7aa','#4a3200','#d9c28a','#4a3200')">Older Paper</button>
<button class="temaBtn" onclick="mudarTema('rgb(111,232,162)','black','#7be8a2','black')">Green & Black</button>
<button class="temaBtn" onclick="mudarTema('#f5f5f5','#222222','#e6e6e6','#222222')">Modern Wiki</button>
<button class="temaBtn" onclick="mudarTema('#f8f4e8','#3d3425','#e8dcc0','#3d3425')">Manuscript</button>
<button class="temaBtn" onclick="mudarTema('#ffffff','#2c2c2c','#f2f2f2','#2c2c2c')">Clean</button>
  </div>      
</div>  
  
<nav id="bottomNav">  
  <button class="navItem active" onclick="window.location.href='index.html'">  
    <span class="navIcon">🏠</span>  
    <span>Home</span>  
  </button>  
  <button class="navItem" onclick="window.location.href='conv.html'">  
    <span class="navIcon">⎘</span>  
    <span>Conv</span>  
  </button>  
  <button class="navItem" onclick="window.location.href='extras.html'">  
    <span class="navIcon">⚛</span>  
    <span>Extras</span>  
  </button>  
  <button class="navItem" onclick="window.location.href='json.html'">  
    <span class="navIcon">🛠️</span>  
    <span>JSON</span>  
  </button>  
  <button class="navItem" onclick="window.location.href='calc.html'">  
    <span class="navIcon">🧮</span>  
    <span>Calc</span>  
  </button>  
</nav>  
    
<script>      
    
let textoOriginal = "";      
    
function normalizar(t){      
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s]/gi,"");      
}      
    
// MODIFICADO: Adaptado para ler a estrutura de Categorias e Itens encadeados
function renderizar(t){      
  const c = document.getElementById("conteudo");      
  c.innerHTML="";      
  
  let categorias = [];
  try {
    const jsonParsed = JSON.parse(t);
    categorias = Array.isArray(jsonParsed) ? jsonParsed : [jsonParsed];
  } catch(e) {
    // Fallback caso receba string pura por quebra de linha antiga
    categorias = [{ category: "Items", items: t.split("\n").filter(l => l.trim()).map(l => ({ name: l })) }];
  }

  categorias.forEach(cat => {      
    if(!cat || !cat.items || cat.items.length === 0) return;
    
    // Cria o divisor visual da Categoria
    const tituloCat = document.createElement("div");
    tituloCat.className = "categoria-titulo";
    tituloCat.textContent = cat.category;
    c.appendChild(tituloCat);

    cat.items.forEach(item => {
      const d = document.createElement("div");      
      d.className = "linha";      
      
      if(item.id) {
        d.textContent = item.id + " - " + (item.name || "");
      } else {
        d.textContent = item.name || "";
      }      
      
      c.appendChild(d);      
    });
  });      
  
  const temaSalvo = localStorage.getItem("tema");
  if(temaSalvo) {
    try {
      const t = JSON.parse(temaSalvo);
      document.querySelectorAll(".linha, .categoria-titulo, #clearSearchBtn").forEach(el => {
        if(el.classList.contains("linha")) el.style.borderLeftColor = t.texto;
        el.style.color = t.texto;
      });
    } catch(e){}
  }
}      
    
function carregarDados(arquivo) {
  fetch(arquivo)    
  .then(r=>{    
    if(!r.ok) throw new Error(`${arquivo} not found`);    
    return r.text();    
  })    
  .then(t=>{    
    textoOriginal=t;    
    renderizar(t);    
      
    const ult=localStorage.getItem("ultimaPesquisa")||"";    
    if(ult){    
      document.getElementById("pesquisa").value=ult;    
      document.getElementById("pesquisa").dispatchEvent(new Event("input"));    
    }    
  })    
  .catch(err=>{    
    document.getElementById("conteudo").innerHTML=    
    `<div class='linha'>Error loading "${arquivo}". Make sure the file exists in the correct directory.</div>`;    
    console.error(err);    
  });     
}

carregarDados("dados.json");
    
// MODIFICADO: Varre a árvore filtrando os itens internos de cada categoria sem sumir com a estrutura
document.getElementById("pesquisa").addEventListener("input",function(){    
  localStorage.setItem("ultimaPesquisa",this.value);    
  const b=normalizar(this.value);    
  
  // Exibir ou ocultar o botão limpar baseado no valor inserido
  const clearBtn = document.getElementById("clearSearchBtn");
  if(this.value) {
    clearBtn.style.display = "block";
  } else {
    clearBtn.style.display = "none";
  }

  if(!b) return renderizar(textoOriginal);    
  
  try {
    const listaCategorias = JSON.parse(textoOriginal);
    
    // Mapeia e filtra mantendo a estrutura estrutural do seu novo JSON
    const filtrados = listaCategorias.map(cat => {
      if(!cat.items) return null;
      
      const itensFiltrados = cat.items.filter(item => {
        if(!item) return false;
        const idMatch = item.id ? normalizar(String(item.id)).includes(b) : false;
        const nameMatch = item.name ? normalizar(item.name).includes(b) : false;
        return idMatch || nameMatch;
      });
      
      return {
        category: cat.category,
        items: itensFiltrados
      };
    }).filter(cat => cat && cat.items.length > 0); // Remove categorias que ficaram vazias na busca
    
    renderizar(JSON.stringify(filtrados));
  } catch(e) {
    // Fallback simples
    renderizar(textoOriginal);    
  }
});    

// Ação do botão limpar adicionada
document.getElementById("clearSearchBtn").onclick = function() {
  const inputPesquisa = document.getElementById("pesquisa");
  inputPesquisa.value = "";
  inputPesquisa.dispatchEvent(new Event("input"));
};
    
/* Controle dos Menus Laterais */  
const drawer = document.getElementById("appDrawer");  
const presets = document.getElementById("presets");  
const overlay = document.getElementById("overlay");  
  
function fecharTodosMenus() {  
  drawer.classList.remove("aberto");  
  presets.classList.remove("aberto");  
  overlay.style.display = "none";  
}  
  
document.getElementById("btnAbrirMenu").onclick = () => {  
  fecharTodosMenus();
  drawer.classList.add("aberto");  
  overlay.style.display = "block";  
};  
  
document.getElementById("btnAbrirConfig").onclick = () => {  
  fecharTodosMenus();
  presets.classList.add("aberto");  
  overlay.style.display = "block";  
};  
  
document.getElementById("btnFecharMenu").onclick = fecharTodosMenus;  
overlay.onclick = fecharTodosMenus;  

document.querySelectorAll('a[data-fetch="true"]').forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    const arquivoDestino = this.getAttribute('href');
    carregarDados(arquivoDestino);
    fecharTodosMenus();
  });
});
    
const abrirTemas = document.getElementById("abrirTemasConfig");      
const listaTemas = document.getElementById("listaTemas");      
    
abrirTemas.onclick = () => {      
  const ok = listaTemas.style.display === "flex";      
  listaTemas.style.display = !ok ? "flex" : "none";      
  abrirTemas.textContent = ok ? "Themes ▼" : "Themes ▲";      
};      
    
/* Comportamento inteligente do Scroll */  
const appBody = document.getElementById("appBody");  
const scrollBtn = document.getElementById("scrollBtn");  
  
appBody.onscroll = () => {  
  if (appBody.scrollTop > 300) {  
    scrollBtn.textContent = "⌃"; 
  } else {  
    scrollBtn.textContent = "⌄"; 
  }  
};  
  
scrollBtn.onclick = () => {      
  if (appBody.scrollTop > 300) {  
    appBody.scrollTo({ top: 0, behavior: "smooth" });  
  } else {  
    appBody.scrollTo({ top: appBody.scrollHeight, behavior: "smooth" });  
  }  
};      
    
/* Lógica de Mudança de Tema Dinâmica */  
function mudarTema(fundo,texto,inputBg,inputText){    
  localStorage.setItem("tema",JSON.stringify({ fundo,texto,inputBg,inputText }));      
    
  document.body.style.background=fundo;      
  document.body.style.color=texto;      
  document.getElementById("appHeader").style.background=fundo;      
  document.getElementById("searchContainer").style.background=fundo;      
  document.getElementById("bottomNav").style.background=fundo;      
  document.getElementById("titulo").style.color=texto;      
      
  document.getElementById("pesquisa").style.color=texto;      
  document.getElementById("pesquisa").style.borderColor=texto;      
  document.getElementById("clearSearchBtn").style.color=texto;
    
  // Atualiza a cor da barra de status do sistema dinamicamente
  document.getElementById("themeColorMeta").setAttribute("content", fundo);
    
  document.querySelectorAll(".menuIconBtn, .navItem, #scrollBtn").forEach(el => {  
    el.style.color = texto;  
  });  
  
  document.getElementById("scrollBtn").style.backgroundColor = inputBg;  
  document.getElementById("scrollBtn").style.borderColor = texto;  
    
  document.querySelectorAll(".temaBtn, .menuLink").forEach(b=>{      
    b.style.backgroundColor=inputBg;      
    b.style.color=inputText;      
    b.style.borderColor=texto;      
  });      

  document.querySelectorAll(".linha").forEach(linha => {
    linha.style.borderLeftColor = texto;
  });

  document.querySelectorAll(".categoria-titulo").forEach(tit => {
    tit.style.color = texto;
  });
}      
    
const temaSalvo=localStorage.getItem("tema");    
if(temaSalvo){    
  try{    
    const t=JSON.parse(temaSalvo);    
    mudarTema(t.fundo,t.texto,t.inputBg,t.inputText);    
  }catch{    
    mudarTema('#111','red','#222','red');    
  }    
}else{    
  mudarTema('#111','red','#222','red');    
}      

// Script adicionado para gerenciar estado ativo do menu inferior de forma inteligente
document.addEventListener("DOMContentLoaded", function() {
  const path = window.location.pathname.split("/").pop();
  document.querySelectorAll("#bottomNav .navItem").forEach(item => {
    item.classList.remove("active");
    const clickAttr = item.getAttribute("onclick") || "";
    if(path && clickAttr.includes(path)) {
      item.classList.add("active");
    }
  });
});
    
/* Inicialização do Service Worker PWA */  
if ("serviceWorker" in navigator) {    
  window.addEventListener("load", () => {    navigator.serviceWorker.register("./service-worker.js").catch(err => console.error("PWA:", err));  });    
}    
</script>      
</body>
