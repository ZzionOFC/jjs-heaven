<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJS HEAVEN</title>

<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">

<style>
body {
  background: #111;
  color: red;
  font-family: 'Finger Paint', cursive, sans-serif;
  padding: 20px;
  margin: 0;
  font-size: 20px;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: 'Finger Paint', cursive, sans-serif;
  font-size: 20px;
  line-height: 1.5;
}
</style>
</head>

<body>

<pre id="conteudo"></pre>

<script>
fetch("dados.json")
  .then(res => res.text())
  .then(texto => {
    document.getElementById("conteudo").textContent = texto;
  })
  .catch(() => {
    document.getElementById("conteudo").textContent = "Erro ao carregar o JSON";
  });
</script>

</body>
</html>
