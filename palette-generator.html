<button class="temaBtn" onclick="mudarTema('#fff4cc','#5a3d00','#ffe599','#5a3d00')">Old Paper</button>

<button class="temaBtn" onclick="mudarTema('rgb(111,232,162)','black','#7be8a2','black')">Green & Black</button>
<button class="temaBtn" onclick="mudarTema('#f5f5f5','#222222','#e6e6e6','#222222')">Modern Wiki</button>

<script>      

function hslToHex(h, s, l) {
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

function gerarPaleta() {
  const container = document.getElementById("palette");
  container.innerHTML = "";
  
  const baseHue = Math.floor(Math.random() * 360);
  const tipos = ['analogous', 'monochromatic', 'complementary', 'triadic'];
  const tipoEscolhido = tipos[Math.floor(Math.random() * tipos.length)];
  
  let cores = [];
  
  if (tipoEscolhido === 'monochromatic') {
    const s = 45 + Math.floor(Math.random() * 30);
    cores = [
      hslToHex(baseHue, s, 20),
      hslToHex(baseHue, s, 35),
      hslToHex(baseHue, s, 50),
      hslToHex(baseHue, s, 65),
      hslToHex(baseHue, s, 80)
    ];
  } else if (tipoEscolhido === 'analogous') {
    const s = 50 + Math.floor(Math.random() * 25);
    const l = 40 + Math.floor(Math.random() * 20);
    cores = [
      hslToHex((baseHue - 40 + 360) % 360, s, l - 10),
      hslToHex((baseHue - 20 + 360) % 360, s, l),
      hslToHex(baseHue, s, l),
      hslToHex((baseHue + 20) % 360, s, l),
      hslToHex((baseHue + 40) % 360, s, l + 10)
    ];
  } else if (tipoEscolhido === 'complementary') {
    const s = 55 + Math.floor(Math.random() * 25);
    const compHue = (baseHue + 180) % 360;
    cores = [
      hslToHex(baseHue, s, 30),
      hslToHex(baseHue, s, 55),
      hslToHex((baseHue + 20) % 360, s - 10, 45),
      hslToHex(compHue, s, 40),
      hslToHex(compHue, s, 65)
    ];
  } else {
    const s = 50 + Math.floor(Math.random() * 20);
    const l = 50;
    cores = [
      hslToHex(baseHue, s, l - 15),
      hslToHex(baseHue, s, l + 15),
      hslToHex((baseHue + 120) % 360, s, l),
      hslToHex((baseHue + 240) % 360, s, l),
      hslToHex((baseHue + 240) % 360, s, l + 20)
    ];
  }

  cores.forEach(hex => {
    const block = document.createElement("div");
    block.className = "color-block";
    block.style.backgroundColor = hex;
    
    const txtCor = document.createElement("span");
    txtCor.textContent = hex.toUpperCase();
    
    const txtClick = document.createElement("span");
    txtClick.textContent = "TAP TO COPY";
    txtClick.style.fontSize = "10px";
    txtClick.style.opacity = "0.6";
    
    block.appendChild(txtCor);
    block.appendChild(txtClick);
    
    block.onclick = () => { 
      navigator.clipboard.writeText(hex); 
      alert("Copied: " + hex); 
    };
    container.appendChild(block);
  });
}
    
const drawer = document.getElementById("appDrawer");  
const presets = document.getElementById("presets");  
const overlay = document.getElementById("overlay");  
  
function fecharTodosMenus() {  
  drawer.classList.remove("aberto");  
  presets.classList.remove("aberto");  
  overlay.style.display = "none";  
}  
  
document.getElementById("btnAbrirMenu").onclick = () => {  
  fecharTodosMenus();
  drawer.classList.add("aberto");  
  overlay.style.display = "block";  
};  
  
document.getElementById("btnAbrirConfig").onclick = () => {  
  fecharTodosMenus();
  presets.classList.add("aberto");  
  overlay.style.display = "block";  
};  
  
document.getElementById("btnFecharMenu").onclick = fecharTodosMenus;  
overlay.onclick = fecharTodosMenus;  
    
const abrirTemas = document.getElementById("abrirTemasConfig");      
const listaTemas = document.getElementById("listaTemas");      
    
abrirTemas.onclick = () => {      
  const ok = listaTemas.style.display === "flex";      
  listaTemas.style.display = !ok ? "flex" : "none";      
  abrirTemas.textContent = ok ? "Themes ▼" : "Themes ▲";      
};      
    
const appBody = document.getElementById("appBody");  
const scrollBtn = document.getElementById("scrollBtn");  
  
appBody.onscroll = () => {  
  if (appBody.scrollTop > 300) {  
    scrollBtn.textContent = "⌃"; 
  } else {  
    scrollBtn.textContent = "⌄"; 
  }  
};  
  
scrollBtn.onclick = () => {      
  if (appBody.scrollTop > 300) {  
    appBody.scrollTo({ top: 0, behavior: "smooth" });  
  } else {  
    appBody.scrollTo({ top: appBody.scrollHeight, behavior: "smooth" });  
  }  
};      
    
function mudarTema(fundo,texto,inputBg,inputText){    
  localStorage.setItem("tema",JSON.stringify({ fundo,texto,inputBg,inputText }));      
    
  document.body.style.background=fundo;      
  document.body.style.color=texto;      
  document.getElementById("appHeader").style.background=fundo;      
  document.getElementById("bottomNav").style.background=fundo;      
  document.getElementById("titulo").style.color=texto;      
    
  document.querySelectorAll(".menuIconBtn, .navItem, #scrollBtn").forEach(el => {  
    el.style.color = texto;  
  });  
  
  document.getElementById("scrollBtn").style.backgroundColor = inputBg;  
  document.getElementById("scrollBtn").style.borderColor = texto;  
    
  document.querySelectorAll(".temaBtn, .menuLink").forEach(b=>{      
    b.style.backgroundColor=inputBg;      
    b.style.color=inputText;      
    b.style.borderColor=texto;      
  });      

  document.getElementById("palette").style.borderColor = texto;
}      
    
const temaSalvo=localStorage.getItem("tema");    
if(temaSalvo){    
  try{    
    const t=JSON.parse(temaSalvo);    
    mudarTema(t.fundo,t.texto,t.inputBg,t.inputText);    
  }catch{    
    mudarTema('#111','red','#222','red');    
  }    
}else{    
  mudarTema('#111','red','#222','red');    
}      

gerarPaleta(); 

document.addEventListener("DOMContentLoaded", function() {
  const path = window.location.pathname.split("/").pop();
  document.querySelectorAll("#bottomNav .navItem").forEach(item => {
    item.classList.remove("active");
    const clickAttr = item.getAttribute("onclick") || "";
    if(path && clickAttr.includes(path)) {
      item.classList.add("active");
    }
  });
});
</script>
